name: Deploy to GitHub Pages

# Déclenche l'action à chaque push sur la branche main (ou master)
on:
  push:
    branches:
      - main
      

# Définit les permissions nécessaires pour que l'action puisse modifier GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet qu'un seul déploiement s'exécute à la fois
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 
          cache: 'npm'

      - name: Installation des dépendances
        run: npm install 

      - name: Build du projet Vite
        run: npm run build

      - name: Upload de l'artefact (dossier dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Job 2 : Déploiement
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4